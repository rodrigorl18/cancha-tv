name: Actualizar guía y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cancha-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Consultar programación pública
        run: node guide-tools/refresh-guide.mjs
      - name: Guardar guía
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guide.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar programación y agenda deportiva'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar sitio y guía
        id: deployment
        uses: actions/deploy-pages@v4
